# Build greet for each supported platform from the release commit. Release Planner calls this
# workflow on the release pull request, then attests and publishes what it uploads.
name: Build release
on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      tag:
        type: string
        required: true
      version:
        type: string
        required: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Test
        run: go vet ./... && go test ./...
      # Reproducible archives: a rebuild of the same commit produces identical files.
      - name: Build the archives
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*} arch=${target#*/}
            dir=$(mktemp -d)
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -buildid= -X main.version=$VERSION" -o "$dir/greet" .
            tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -C "$dir" -cf - greet | gzip -n > "dist/greet_${VERSION}_${os}_${arch}.tar.gz"
          done
          (cd dist && sha256sum -- *.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error
